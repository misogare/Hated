name: Web demo

# The web demo on GitHub Pages: the app built with EXPO_PUBLIC_DEMO=1, so it runs
# on made-up people entirely in the visitor's browser (packages/mobile/src/demo).
# Published on every push to main. Settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress finishes; newer pushes wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the demo
        run: npm run demo:export -w @hated/mobile
        env:
          # /<repo> for https://<owner>.github.io/<repo>/, or empty on a custom domain.
          HATED_BASE_URL: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
