name: Web demo

# The web demo on GitHub Pages: the app built with EXPO_PUBLIC_DEMO=1, so it runs
# on made-up people entirely in the visitor's browser (packages/mobile/src/demo).
# Published after CI passes on main (ci.yml tests the same build end to end), or
# by hand. Settings → Pages → Source must be "GitHub Actions".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress finishes; newer ones wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only a push to this repository's main that passed CI: a pull request from a
    # fork's own "main" branch must never reach the deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the demo
        run: npm run demo:export -w @hated/mobile
        env:
          # /<repo> for https://<owner>.github.io/<repo>/, or empty on a custom domain.
          HATED_BASE_URL: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
